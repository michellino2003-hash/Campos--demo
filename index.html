<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CampOS" />
  <meta name="description" content="CampOS boxing and performance founder demo." />
  <title>CampOS Founder Demo</title>
  <style>
:root {
  --bg: #050505;
  --surface: #0e0e0f;
  --surface-2: #161618;
  --surface-3: #1d1d20;
  --line: #2e2e33;
  --text: #f6f1e7;
  --muted: #a0a0a8;
  --red: #e21d2f;
  --red-dark: #9f111d;
  --gold: #d5a53b;
  --green: #55c874;
  --yellow: #e7b543;
  --danger: #ff5a67;
  --safe-top: max(12px, env(safe-area-inset-top));
  --safe-bottom: max(14px, env(safe-area-inset-bottom));
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #020202; color: var(--text); }
body {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at 50% -8%, rgba(226,29,47,.20), transparent 32%),
    radial-gradient(circle at 50% 108%, rgba(213,165,59,.08), transparent 33%),
    #020202;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
button, input, textarea, select { font: inherit; }
button { border: 0; }
a { color: inherit; }

.app-shell {
  min-height: 100dvh;
  max-width: 480px;
  margin: 0 auto;
  background: linear-gradient(180deg,#09090a,#050505 70%);
  position: relative;
  overflow-x: hidden;
  box-shadow: 0 0 80px rgba(0,0,0,.65);
}

.screen {
  min-height: 100dvh;
  padding: calc(var(--safe-top) + 8px) 16px calc(92px + var(--safe-bottom));
  animation: screenIn .2s ease;
}
.screen.no-nav { padding-bottom: calc(22px + var(--safe-bottom)); }
@keyframes screenIn { from { opacity: .3; transform: translateY(5px); } to { opacity: 1; transform: none; } }

.brand {
  font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
  font-size: 31px;
  letter-spacing: 4px;
  text-align: center;
  margin: 5px 0 18px;
}
.wordmark {
  font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
  font-size: clamp(52px, 16vw, 72px);
  line-height: .92;
  letter-spacing: 6px;
}
h1,h2,h3,p { margin-top: 0; }
h1,h2,h3 { font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; letter-spacing: .75px; }
h1 { font-size: 36px; line-height: 1.03; }
h2 { font-size: 25px; }
h3 { font-size: 20px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.tiny { font-size: 11px; }
.center { text-align: center; }
.eyebrow { color: var(--red); font-size: 11px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
.notice { color: #d3d3d8; font-size: 13px; line-height: 1.5; }

.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }

.card {
  border: 1px solid var(--line);
  border-radius: 15px;
  background: linear-gradient(180deg,var(--surface-2),var(--surface));
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: inset 0 1px rgba(255,255,255,.025);
}
.card.gold { border-color: #6f5826; background: linear-gradient(180deg,rgba(213,165,59,.16),rgba(28,22,9,.72)); }
.card.red { border-color: #6b2028; background: linear-gradient(180deg,rgba(226,29,47,.14),rgba(35,8,12,.70)); }
.card.pressable { cursor: pointer; transition: transform .12s ease, background .12s ease; }
.card.pressable:active { transform: scale(.99); background: #19191c; }

.btn {
  display: block;
  width: 100%;
  border-radius: 10px;
  padding: 15px 14px;
  color: white;
  text-align: center;
  font-weight: 900;
  letter-spacing: .35px;
  cursor: pointer;
  transition: transform .11s ease, filter .11s ease;
}
.btn:active { transform: scale(.985); filter: brightness(.94); }
.btn.primary { background: linear-gradient(180deg,#f0273a,#b6111f); box-shadow: 0 8px 24px rgba(226,29,47,.18); }
.btn.secondary { background: #141416; border: 1px solid #45454b; }
.btn.ghost { background: transparent; border: 1px solid #37373c; color: #ddd; }
.btn.danger { background: #4b1118; border: 1px solid #7e1f2a; }
.btn.inline { width: auto; padding: 10px 13px; }
.btn + .btn { margin-top: 8px; }

.icon-btn {
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center; color: white;
  background: #151517; border: 1px solid #35353a; font-size: 21px;
}
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
.topbar strong { font-size: 13px; letter-spacing: .6px; }

.progress-line { height: 4px; border-radius: 999px; background: #29292d; overflow: hidden; }
.progress-line > span { display: block; height: 100%; background: linear-gradient(90deg,var(--red-dark),var(--red)); transition: width .25s ease; }

.hero { display: flex; flex-direction: column; justify-content: space-between; text-align: center; }
.hero-top { padding-top: 45px; }
.hero-ring { height: 290px; position: relative; margin: 0 -16px; }
.hero-ring::before {
  content: ""; position: absolute; left: 4%; right: 4%; bottom: 25px; height: 116px;
  border: 2px solid #424247; border-top-color: #6c6c73;
  transform: perspective(340px) rotateX(58deg); box-shadow: 0 36px 44px rgba(0,0,0,.68);
}
.hero-ring::after {
  content: ""; position: absolute; left: 10%; right: 10%; bottom: 84px; height: 2px; background: #67676d;
  box-shadow: 0 31px 0 #4c4c52, 0 62px 0 #343438;
}

.option {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 15px; margin-bottom: 10px; border: 1px solid #303034; border-radius: 11px;
  background: #151517; color: var(--text); cursor: pointer;
}
.option.selected { border-color: var(--gold); background: rgba(213,165,59,.11); box-shadow: inset 0 0 0 1px rgba(213,165,59,.18); }

.bottom-nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: min(480px,100%); height: calc(74px + var(--safe-bottom)); padding-bottom: var(--safe-bottom);
  display: grid; grid-template-columns: repeat(4,1fr); z-index: 20;
  background: rgba(7,7,8,.96); backdrop-filter: blur(14px); border-top: 1px solid #242426;
}
.nav-btn { background: transparent; color: #8b8b92; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10px; }
.nav-btn.active { color: var(--red); }
.nav-icon { font-size: 20px; line-height: 1; }

.score {
  width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center;
  border: 4px solid var(--gold); flex: none; font-size: 20px; font-weight: 900;
  box-shadow: 0 0 0 5px rgba(213,165,59,.055);
}
.meta { display: flex; flex-wrap: wrap; gap: 13px; color: #d2d2d7; font-size: 11px; }
.week { display: grid; grid-template-columns: repeat(7,1fr); gap: 7px; margin-top: 10px; }
.day { text-align: center; font-size: 10px; color: #919198; }
.day-dot { width: 27px; height: 27px; border: 1px solid #3a3a3f; border-radius: 50%; display: grid; place-items: center; margin: 6px auto 0; }
.day-dot.done { border-color: var(--green); color: var(--green); }
.day-dot.today { border: 2px solid var(--red); color: white; }

.result-orb {
  width: 92px; height: 92px; margin: 28px auto 22px; border: 5px solid var(--gold); border-radius: 50%;
  display: grid; place-items: center; color: var(--gold); font-size: 47px; box-shadow: 0 0 38px rgba(213,165,59,.1);
}
.block { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #29292c; }
.block:last-child { border-bottom: 0; }

.timer-ring {
  width: 236px; height: 236px; border-radius: 50%; margin: 30px auto;
  display: grid; place-items: center; position: relative;
  background: conic-gradient(var(--red) var(--timer-progress,20%), #28282c 0);
  box-shadow: 0 0 45px rgba(226,29,47,.08);
}
.timer-ring::before { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: #080809; }
.timer-content { position: relative; text-align: center; }
.time { font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; font-size: 64px; line-height: 1; }

.exercise-demo {
  height: 175px; border-radius: 13px; border: 1px solid #333338; margin: 12px 0 14px; position: relative; overflow: hidden;
  background: linear-gradient(180deg,transparent,rgba(0,0,0,.82)), radial-gradient(circle at 55% 46%,#5a5a60,#29292d 33%,#151517 68%);
}
.exercise-demo::before { content:""; position:absolute; left:15%; right:15%; bottom:35px; height:8px; border-radius:8px; background:#77777d; box-shadow:0 -50px 0 #303035; }
.exercise-demo::after { content: attr(data-label); position: absolute; left: 14px; bottom: 12px; font-size: 11px; letter-spacing: 1px; color: #ddd; }
.cues { padding-left: 18px; color: #d4d4d8; font-size: 13px; line-height: 1.55; }
.log-box { padding: 12px; border: 1px solid #35353a; background: #101012; border-radius: 10px; text-align: center; }
.number-input { width: 100%; border: 1px solid #39393e; background: #0b0b0c; border-radius: 9px; color: var(--text); padding: 13px; text-align: center; font-weight: 800; }
textarea, input[type="text"], select {
  width: 100%; background: #0b0b0c; color: var(--text); border: 1px solid #39393e; border-radius: 10px; padding: 13px;
}
textarea { min-height: 110px; resize: vertical; }

.badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 7px 10px; font-size: 11px; border: 1px solid #3b3b40; background: #111113; }
.badge.green { color: #92e5a5; border-color: #255832; }
.badge.gold { color: #f1d489; border-color: #675326; }
.badge.red { color: #ff9da6; border-color: #6d252d; }

.metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.metric-card { border: 1px solid var(--line); background: linear-gradient(180deg,var(--surface-2),var(--surface)); border-radius: 13px; padding: 13px; }
.metric-card strong { font-size: 30px; }
.chart { height: 120px; display: flex; align-items: end; gap: 8px; padding-top: 10px; }
.chart-bar { flex: 1; min-width: 14px; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg,var(--red),var(--red-dark)); position: relative; }
.chart-bar::after { content: attr(data-label); position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 9px; color: var(--muted); }

.toast {
  position: fixed; left: 50%; bottom: calc(90px + var(--safe-bottom)); transform: translate(-50%,18px);
  width: min(440px,calc(100% - 32px)); opacity: 0; pointer-events: none; transition: .22s;
  background: #f3eee5; color: #09090a; border-radius: 12px; padding: 13px 14px; font-size: 13px; font-weight: 800; z-index: 40;
  box-shadow: 0 16px 45px rgba(0,0,0,.55);
}
.toast.show { opacity: 1; transform: translate(-50%,0); }

.empty { padding: 28px 10px; text-align: center; color: var(--muted); }
.divider { height: 1px; background: var(--line); margin: 14px 0; }
.footer-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; font-size: 11px; color: var(--muted); margin-top: 16px; }

@media (min-width: 481px) {
  .app-shell { min-height: 900px; margin-top: 18px; margin-bottom: 18px; border: 1px solid #2b2b2f; border-radius: 34px; overflow: hidden; }
  .bottom-nav { border-radius: 0 0 34px 34px; }
}

  </style>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <noscript>CampOS requires JavaScript to run.</noscript>
  <script>
(() => {
  'use strict';

  const STORAGE_KEY = 'campos.mobile.web.demo.v1';
  const app = document.getElementById('app');

  const defaultState = {
    onboarded: false,
    athlete: {
      name: 'Michael',
      goals: ['Improve boxing skill', 'Build elite conditioning'],
      experience: 'Returning after time away',
      days: ['Monday', 'Wednesday', 'Friday', 'Saturday'],
      locations: ['Commercial gym', 'Home'],
      limitations: ['Wrists or hands', 'Lower back'],
      coachStyle: 'Direct and disciplined'
    },
    route: 'welcome',
    readiness: null,
    readinessDraft: { sleep: 3, energy: 3, soreness: 2, pain: 1, time: 45 },
    prepared: false,
    currentSession: null,
    sessionHistory: [],
    feedback: [],
    settings: { sound: true, haptics: true, analytics: false },
    demoSeeded: false
  };

  const sessionTemplate = {
    id: 'week1-lower-footwork',
    title: 'Lower Body + Footwork',
    purpose: 'Build controlled lower-body strength while reinforcing stance, balance, and directional movement.',
    originalMinutes: 63,
    adjustedMinutes: 48,
    intensity: 'Moderate',
    location: 'Gym',
    blocks: [
      { id: 'warmup', type: 'timed', title: 'Dynamic Warm-up', minutes: 6, cues: ['Easy treadmill walk', 'Ankle rocks', 'Bodyweight box squat', 'Hip hinge drill'] },
      { id: 'leg-press', type: 'strength', title: 'Leg Press', sets: 3, targetReps: 10, suggestedWeight: 140, restSeconds: 90, cues: ['Keep the entire foot planted.', 'Maintain control through the bottom position.', 'Do not force additional depth.', 'Stop before repetition speed breaks down.'] },
      { id: 'rdl', type: 'strength', title: 'Romanian Deadlift', sets: 3, targetReps: 8, suggestedWeight: 65, restSeconds: 90, cues: ['Push the hips backward.', 'Keep the weight close to the legs.', 'Stop before the lower back rounds.'] },
      { id: 'split-squat', type: 'strength', title: 'Supported Split Squat', sets: 2, targetReps: 8, suggestedWeight: 0, restSeconds: 75, cues: ['Use support for balance.', 'Keep the front foot planted.', 'Work only through a pain-free range.'] },
      { id: 'boxing', type: 'boxing', title: 'Footwork Fundamentals', rounds: 3, roundSeconds: 120, restSeconds: 60, cues: ['Move forward and backward without crossing your feet.', 'Relax your shoulders and return to stance.', 'Small steps. Keep your base underneath you.', 'Change direction without bringing your feet together.'] },
      { id: 'cooldown', type: 'timed', title: 'Cooldown', minutes: 5, cues: ['Easy walk', 'Controlled breathing', 'Gentle hip and calf mobility'] }
    ]
  };

  let state = loadState();
  let timerHandle = null;
  let readinessStep = 0;
  let onboardingStep = 0;
  let onboardingDraft = JSON.parse(JSON.stringify(state.athlete));

  function loadState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? { ...defaultState, ...JSON.parse(saved) } : JSON.parse(JSON.stringify(defaultState));
    } catch {
      return JSON.parse(JSON.stringify(defaultState));
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function vibrate(pattern = 12) {
    if (state.settings.haptics && navigator.vibrate) navigator.vibrate(pattern);
  }

  function toast(message) {
    let node = document.querySelector('.toast');
    if (!node) {
      node = document.createElement('div');
      node.className = 'toast';
      document.body.appendChild(node);
    }
    node.textContent = message;
    node.classList.add('show');
    window.setTimeout(() => node.classList.remove('show'), 1900);
  }

  function navigate(route) {
    state.route = route;
    saveState();
    clearInterval(timerHandle);
    timerHandle = null;
    window.scrollTo(0, 0);
    render();
    vibrate(9);
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]));
  }

  function nav(active) {
    return `
      <nav class="bottom-nav" aria-label="Primary navigation">
        ${navButton('today','◉','TODAY',active)}
        ${navButton('plan','▤','PLAN',active)}
        ${navButton('progress','▥','PROGRESS',active)}
        ${navButton('profile','♙','PROFILE',active)}
      </nav>`;
  }

  function navButton(route, icon, label, active) {
    return `<button class="nav-btn ${route === active ? 'active' : ''}" data-route="${route}"><span class="nav-icon">${icon}</span><span>${label}</span></button>`;
  }

  function shell(content, { navActive = null, noNav = false } = {}) {
    app.innerHTML = `<main class="app-shell"><section class="screen ${noNav ? 'no-nav' : ''}">${content}</section>${noNav ? '' : nav(navActive)}</main>`;
    bindCommonEvents();
  }

  function topbar(title, backRoute) {
    return `<div class="topbar"><button class="icon-btn" data-route="${backRoute}" aria-label="Back">‹</button><strong>${escapeHtml(title)}</strong><span></span></div>`;
  }

  function render() {
    const route = state.route || (state.onboarded ? 'today' : 'welcome');
    const routes = {
      welcome: renderWelcome,
      onboarding: renderOnboarding,
      generated: renderGenerated,
      today: renderToday,
      readiness: renderReadiness,
      readinessResult: renderReadinessResult,
      preview: renderPreview,
      runner: renderRunner,
      complete: renderComplete,
      plan: renderPlan,
      progress: renderProgress,
      profile: renderProfile,
      feedback: renderFeedback,
      settings: renderSettings,
      legal: renderLegal
    };
    (routes[route] || renderWelcome)();
  }

  function renderWelcome() {
    shell(`
      <div class="hero">
        <div class="hero-top">
          <div class="wordmark">CAMPOS</div>
          <div style="width:82px;height:2px;background:var(--red);margin:20px auto"></div>
          <div class="eyebrow" style="color:#ddd;letter-spacing:3px">ADAPT. PERFORM. WIN.</div>
          <div class="hero-ring"></div>
          <h1>YOUR CAMP STARTS TODAY.</h1>
          <p class="muted">A personalized boxing and performance system built around your schedule, recovery, equipment, and goals.</p>
        </div>
        <div>
          <button class="btn primary" id="buildCamp">BUILD MY CAMP</button>
          <button class="btn ghost" id="demoCamp">OPEN FOUNDER DEMO</button>
          <div class="footer-links"><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="support.html">Support</a></div>
        </div>
      </div>`, { noNav: true });
    document.getElementById('buildCamp').onclick = () => {
      onboardingStep = 0;
      onboardingDraft = JSON.parse(JSON.stringify(state.athlete));
      navigate('onboarding');
    };
    document.getElementById('demoCamp').onclick = () => {
      state.onboarded = true;
      seedDemoHistory();
      navigate('today');
    };
  }

  const onboardingSteps = [
    { key: 'goals', title: 'YOUR PRIMARY MISSION', body: 'Choose the outcomes CampOS should prioritize.', multi: true, options: ['Improve boxing skill','Build elite conditioning','Lose body fat','Build an athletic physique','Increase strength','Develop consistency'] },
    { key: 'experience', title: 'WHERE ARE YOU STARTING?', body: 'Your current workload matters more than what you could do years ago.', multi: false, options: ['Completely new','Beginner','Returning after time away','Intermediate','Competitive boxer'] },
    { key: 'days', title: 'WHEN CAN YOU TRAIN?', body: 'Choose the days you can reliably protect.', multi: true, options: ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'] },
    { key: 'locations', title: 'WHERE WILL YOU TRAIN?', body: 'CampOS only prescribes equipment you can access.', multi: true, options: ['Commercial gym','Boxing gym','Home','Mixed locations'] },
    { key: 'limitations', title: 'ANYTHING TO PROTECT?', body: 'Select current discomfort, previous injuries, or movement limitations.', multi: true, options: ['Wrists or hands','Shoulders','Lower back','Hips','Knees','Ankles or feet','No current limitations'] },
    { key: 'coachStyle', title: 'HOW SHOULD YOUR COACH SPEAK?', body: 'The principles remain serious. The delivery adapts to you.', multi: false, options: ['Calm and supportive','Direct and disciplined','High-energy motivator','Technical and analytical','Balanced'] }
  ];

  function renderOnboarding() {
    const step = onboardingSteps[onboardingStep];
    const rawSelected = onboardingDraft[step.key];
    const selected = Array.isArray(rawSelected) ? rawSelected : [rawSelected];
    shell(`
      <div class="topbar"><button class="icon-btn" id="onboardingBack" aria-label="Back">‹</button><strong>BUILD YOUR CAMP</strong><span></span></div>
      <div class="row small muted" style="margin-bottom:8px"><span>STEP ${onboardingStep + 1}</span><span>${onboardingStep + 1} / ${onboardingSteps.length}</span></div>
      <div class="progress-line"><span style="width:${((onboardingStep + 1) / onboardingSteps.length) * 100}%"></span></div>
      <div style="height:20px"></div>
      <div class="eyebrow">Athlete setup</div>
      <h1>${step.title}</h1>
      <p class="muted">${step.body}</p>
      <div id="options">
        ${step.options.map(option => `<button class="option ${selected.includes(option) ? 'selected' : ''}" data-option="${escapeHtml(option)}"><strong>${escapeHtml(option)}</strong><span>${selected.includes(option) ? '✓' : ''}</span></button>`).join('')}
      </div>
      <button class="btn primary" id="onboardingNext">${onboardingStep === onboardingSteps.length - 1 ? 'BUILD MY CAMP' : 'CONTINUE'}</button>`, { noNav: true });

    document.querySelectorAll('[data-option]').forEach(button => {
      button.onclick = () => {
        const value = button.dataset.option;
        if (step.multi) {
          const list = Array.isArray(onboardingDraft[step.key]) ? onboardingDraft[step.key] : [];
          onboardingDraft[step.key] = list.includes(value) ? list.filter(item => item !== value) : [...list, value];
        } else {
          onboardingDraft[step.key] = value;
        }
        vibrate(10);
        renderOnboarding();
      };
    });
    document.getElementById('onboardingBack').onclick = () => {
      if (onboardingStep > 0) { onboardingStep -= 1; renderOnboarding(); }
      else navigate('welcome');
    };
    document.getElementById('onboardingNext').onclick = () => {
      const current = onboardingDraft[step.key];
      if ((Array.isArray(current) && !current.length) || (!Array.isArray(current) && !current)) {
        toast('Choose at least one option to continue.');
        return;
      }
      if (onboardingStep < onboardingSteps.length - 1) {
        onboardingStep += 1;
        renderOnboarding();
      } else {
        state.athlete = onboardingDraft;
        state.onboarded = true;
        saveState();
        navigate('generated');
      }
    };
  }

  function renderGenerated() {
    shell(`
      ${topbar('CAMP GENERATED','onboarding')}
      <div class="center"><div class="result-orb">✓</div><div class="eyebrow">Your first week is ready</div><h1>FOUNDATION CAMP</h1><p class="notice">The opening week balances boxing fundamentals, controlled strength work, conditioning, and recovery.</p></div>
      <div class="card">
        <div class="block"><span>Monday · Upper Strength</span><span class="muted">60 min</span></div>

  function getReadinessStatus() {
    const r = state.readinessDraft;
    const painRisk = r.pain >= 3;
    const severe = r.sleep <= 1 || r.energy <= 1 || r.soreness >= 5 || r.pain >= 4;
    const yellow = r.sleep <= 2 || r.energy <= 2 || r.soreness >= 3 || r.pain >= 2 || r.time < 45;
    if (painRisk || severe) return { color: 'red', label: 'RECOVERY MISSION', score: 38, minutes: 15, explanation: 'Your check-in contains a safety or recovery signal. Today shifts to recovery and medical guidance when appropriate.' };
    if (yellow) return { color: 'gold', label: 'MODIFIED SESSION', score: 72, minutes: Math.min(r.time,48), explanation: 'Energy, soreness, pain, or time is below baseline. Volume is reduced while the primary objective remains.' };
    return { color: 'green', label: 'FULL SESSION', score: 88, minutes: 63, explanation: 'Recovery supports the full mission. Maintain technical control and prescribed effort.' };
  }

  function renderToday() {
    const readiness = state.readiness || getReadinessStatus();
    const completed = state.sessionHistory.length;
    shell(`
      <div class="brand">CAMPOS</div>
      <div class="eyebrow">Founder Camp</div><div class="tiny" style="margin:4px 0 12px">WEEK 1 · DAY 4</div>

        </div>

      <button class="btn ghost" data-route="feedback">SEND FOUNDER FEEDBACK</button>`, { navActive: 'today' });
    document.getElementById('prepared').onclick = () => {
      state.prepared = true;
      saveState();
      vibrate([18,35,18]);
      toast('Preparation recorded.');
      renderToday();
    };

  const readinessQuestions = [
    { key:'sleep', question:'HOW DID YOU SLEEP?', options:[[1,'Very poorly'],[2,'Poorly'],[3,'Adequately'],[4,'Well'],[5,'Very well']] },
    { key:'energy', question:'HOW IS YOUR ENERGY?', options:[[1,'Very low'],[2,'Low'],[3,'Moderate'],[4,'Good'],[5,'Excellent']] },
    { key:'soreness', question:'HOW SORE ARE YOU?', options:[[1,'None'],[2,'Mild'],[3,'Moderate'],[4,'High'],[5,'Severe']] },
    { key:'pain', question:'HAS ANY PAIN CHANGED?', options:[[1,'No pain'],[2,'No meaningful change'],[3,'New discomfort'],[4,'Pain has worsened']] },
    { key:'time', question:'HOW MUCH TIME DO YOU HAVE?', options:[[63,'Full session'],[45,'45 minutes'],[30,'30 minutes'],[15,'15 minutes'],[0,'Unable to train']] }
  ];

  function renderReadiness() {
    const q = readinessQuestions[readinessStep];
    const selected = state.readinessDraft[q.key];
    shell(`
      ${topbar('READINESS CHECK','today')}
      <div class="row small muted" style="margin-bottom:8px"><span>STEP ${readinessStep + 1} OF 5</span><span>${Math.round(((readinessStep + 1)/5)*100)}%</span></div>
      <div class="progress-line"><span style="width:${((readinessStep + 1)/5)*100}%"></span></div>
      <div style="height:24px"></div><div class="center"><div class="eyebrow">Prepare today’s session</div><h1>${q.question}</h1></div>
      ${q.options.map(([value,label]) => `<button class="option ${selected === value ? 'selected' : ''}" data-readiness-value="${value}"><span>${escapeHtml(label)}</span><span>${selected === value ? '✓' : ''}</span></button>`).join('')}
      <button class="btn primary" id="readinessNext">${readinessStep === 4 ? 'PREPARE SESSION' : 'NEXT'}</button>`, { noNav: true });
    document.querySelectorAll('[data-readiness-value]').forEach(button => {
      button.onclick = () => {
        state.readinessDraft[q.key] = Number(button.dataset.readinessValue);
        saveState();
        vibrate(10);
        renderReadiness();
      };
    });
    document.getElementById('readinessNext').onclick = () => {
      if (readinessStep < 4) { readinessStep += 1; renderReadiness(); }
      else {
        readinessStep = 0;
        state.readiness = getReadinessStatus();
        saveState();
        navigate('readinessResult');
      }
    };
  }

  function renderReadinessResult() {
    const r = state.readiness || getReadinessStatus();
    const statusColor = r.color === 'gold' ? 'var(--gold)' : `var(--${r.color})`;
    shell(`
      ${topbar('READINESS RESULT','readiness')}
      <div class="center"><div class="result-orb" style="border-color:${statusColor};color:${statusColor}">✓</div><h1>TODAY’S SESSION<br>IS READY</h1><p><strong style="color:${statusColor}">STATUS: ${r.label}</strong></p><p class="notice">${r.explanation}</p></div>
      <div class="grid-2"><div class="log-box"><div class="muted tiny">ORIGINAL</div><strong style="font-size:25px">63 MIN</strong></div><div class="log-box"><div class="muted tiny">TODAY</div><strong style="font-size:25px">${r.minutes} MIN</strong></div></div>
      <div style="height:16px"></div><button class="btn primary" data-route="preview">REVIEW SESSION</button>`, { noNav: true });
  }

  function renderPreview() {
    const r = state.readiness || getReadinessStatus();
    shell(`
      ${topbar(sessionTemplate.title,'today')}
      <div class="center muted tiny">${r.minutes} MIN · ${sessionTemplate.intensity.toUpperCase()}</div><div style="height:18px"></div>
      <div class="eyebrow">Today’s purpose</div><p class="notice">${sessionTemplate.purpose}</p>
      <div class="eyebrow">Training blocks</div><div class="card">${sessionTemplate.blocks.map((b,i) => `<div class="block"><span>${i+1} · ${b.title}</span><span class="muted">${b.type === 'strength' ? `${b.sets} sets` : b.type === 'boxing' ? `${b.rounds} rounds` : `${b.minutes} min`}</span></div>`).join('')}</div>
      <div class="eyebrow">Protection notes</div><p class="notice">Maintain two to four controlled repetitions in reserve. Stop if pain becomes sharp, unstable, or progressively worse.</p>
      <button class="btn primary" id="startSession">BEGIN SESSION</button><button class="btn secondary" id="shortenSession">USE 30-MINUTE VERSION</button>`, { noNav: true });
    document.getElementById('startSession').onclick = () => startSession(false);
    document.getElementById('shortenSession').onclick = () => startSession(true);
  }

  function startSession(shortened) {
    const blocks = shortened ? sessionTemplate.blocks.filter(block => !['split-squat'].includes(block.id)) : sessionTemplate.blocks;
    state.currentSession = {
      id: `session-${Date.now()}`,
      templateId: sessionTemplate.id,
      title: sessionTemplate.title,
      startedAt: Date.now(),
      updatedAt: Date.now(),
      completedAt: null,
      blockIndex: 0,
      setIndex: 0,
      roundIndex: 0,
      activeTimer: null,
      shortened,
      blocks,
      logs: [],
      painFlags: [],
      skipped: []
    };
    saveState();
    navigate('runner');
  }

  function renderRunner() {
    const s = state.currentSession;
    if (!s || s.completedAt) { navigate('today'); return; }
    const block = s.blocks[s.blockIndex];
    if (!block) { finishSession(); return; }
    if (s.activeTimer) {
      resumeActiveTimer(s, block);
      return;
    }
    if (block.type === 'strength') renderStrengthBlock(s, block);
    else if (block.type === 'boxing') renderBoxingBlock(s, block);
    else renderTimedBlock(s, block);
  }

  function resumeActiveTimer(s, block) {
    const active = s.activeTimer;
    if (!active) return;
    const remaining = Math.max(0, Math.ceil((active.endsAt - Date.now()) / 1000));
    if (remaining <= 0) {
      s.activeTimer = null;
      saveState();
      if (active.kind === 'boxing') completeBoxingRound(block);
      else if (active.kind === 'warmup' || active.kind === 'cooldown') completeTimedBlock(block);
      else renderRunner();
      return;
    }
    if (active.kind === 'boxing') {
      window.__camposTimerComplete = () => completeBoxingRound(block);
      renderTimerScreen(`ROUND ${s.roundIndex + 1}`, block.cues[(s.roundIndex + 1) % block.cues.length], active.durationSeconds, true);
      return;
    }
    if (active.kind === 'warmup' || active.kind === 'cooldown') {
      window.__camposTimerComplete = () => completeTimedBlock(block);
      renderTimerScreen(block.title.toUpperCase(), block.cues[0], active.durationSeconds);
      return;
    }
    window.__camposTimerComplete = () => renderRunner();
    renderTimerScreen('REST', 'Recover under control.', active.durationSeconds);
  }

  function sessionHeader(s, block) {
    const pct = Math.round(((s.blockIndex + 1) / s.blocks.length) * 100);
    return `${topbar(s.title,'preview')}<div class="row tiny muted"><span>BLOCK ${s.blockIndex + 1} OF ${s.blocks.length}</span><span>${pct}%</span></div><div class="progress-line"><span style="width:${pct}%"></span></div><div style="height:18px"></div>`;
  }

  function renderStrengthBlock(s, block) {
    const setNumber = s.setIndex + 1;
    const recommendation = suggestedLoad(block.id, block.suggestedWeight);
    shell(`
      ${sessionHeader(s,block)}
      <div class="eyebrow">Strength block</div><h1>${block.title.toUpperCase()}</h1><strong>SET ${setNumber} OF ${block.sets}</strong>
      <div class="exercise-demo" data-label="${escapeHtml(block.title.toUpperCase())} · MOTION GUIDE"></div>
      <div class="card gold"><div class="row"><div><div class="eyebrow" style="color:var(--gold)">CampOS recommendation</div><strong>${recommendation.weight ? `${recommendation.weight} LB` : 'BODYWEIGHT'}</strong></div><span class="badge gold">${recommendation.confidence}</span></div><p class="notice" style="margin:8px 0 0">${recommendation.reason}</p></div>
      <div class="eyebrow">Coaching cues</div><ul class="cues">${block.cues.map(cue => `<li>${cue}</li>`).join('')}</ul>
      <div class="grid-2"><div><label class="tiny muted">WEIGHT</label><input class="number-input" id="weightInput" inputmode="decimal" type="number" min="0" step="2.5" value="${recommendation.weight}"></div><div><label class="tiny muted">REPS</label><input class="number-input" id="repsInput" inputmode="numeric" type="number" min="0" value="${block.targetReps}"></div></div>
      <div style="height:14px"></div><div class="eyebrow">How did the set feel?</div>
      <select id="effortInput"><option value="easier">Easier than planned</option><option value="target" selected>On target</option><option value="harder">Harder than planned</option><option value="pain">Pain or discomfort</option></select>
      <div style="height:12px"></div><button class="btn primary" id="completeSet">COMPLETE SET</button><button class="btn danger" id="painFlag">REPORT PAIN</button><button class="btn ghost" id="skipBlock">SKIP BLOCK</button>`, { noNav: true });

    document.getElementById('completeSet').onclick = () => {
      const weight = Number(document.getElementById('weightInput').value || 0);
      const reps = Number(document.getElementById('repsInput').value || 0);
      const effort = document.getElementById('effortInput').value;
      s.logs.push({ type:'set', blockId:block.id, title:block.title, set:setNumber, weight, reps, targetReps:block.targetReps, effort, at:Date.now() });
      s.updatedAt = Date.now();
      if (effort === 'pain') s.painFlags.push({ blockId:block.id, severity:3, note:'Pain selected during set.', at:Date.now() });
      if (s.setIndex + 1 < block.sets) {
        s.setIndex += 1;
        beginTimer('rest', block.restSeconds, () => renderRunner());
      } else {
        s.setIndex = 0;
        s.blockIndex += 1;
        beginTimer('rest', block.restSeconds, () => renderRunner());
      }
      saveState();
      vibrate([18,35,18]);
      renderTimerScreen('SET COMPLETE', `${reps} REPS · ${weight || 'BODYWEIGHT'}${weight ? ' LB' : ''}`, block.restSeconds);
    };
    document.getElementById('painFlag').onclick = () => {
      const note = prompt('Where did you feel pain or instability?') || 'Pain reported during exercise.';
      s.painFlags.push({ blockId:block.id, severity:3, note, at:Date.now() });
      saveState();
      toast('Pain flag saved. Progression will be protected.');
    };
    document.getElementById('skipBlock').onclick = () => skipCurrentBlock('Athlete skipped strength block.');
  }

  function renderTimedBlock(s, block) {
    shell(`
      ${sessionHeader(s,block)}
      <div class="center"><div class="eyebrow">${block.id === 'warmup' ? 'Prepare to train' : 'Finish under control'}</div><h1>${block.title.toUpperCase()}</h1><p class="muted">${block.minutes} minutes</p></div>
      <div class="card">${block.cues.map((cue,i) => `<div class="block"><span>${i+1}. ${cue}</span><span class="muted">✓</span></div>`).join('')}</div>
      <button class="btn primary" id="beginTimed">START ${block.title.toUpperCase()}</button><button class="btn ghost" id="completeTimed">MARK COMPLETE</button><button class="btn ghost" id="skipTimed">SKIP BLOCK</button>`, { noNav: true });
    document.getElementById('beginTimed').onclick = () => {
      beginTimer(block.id, block.minutes * 60, () => completeTimedBlock(block));
      renderTimerScreen(block.title.toUpperCase(), block.cues[0], block.minutes * 60);
    };
    document.getElementById('completeTimed').onclick = () => completeTimedBlock(block);
    document.getElementById('skipTimed').onclick = () => skipCurrentBlock(`Athlete skipped ${block.title}.`);
  }

  function completeTimedBlock(block) {
    const s = state.currentSession;
    if (!s) return;
    s.logs.push({ type:'timed', blockId:block.id, title:block.title, completedSeconds:block.minutes*60, at:Date.now() });
    s.activeTimer = null;
    s.blockIndex += 1;
    s.updatedAt = Date.now();
    saveState();
    vibrate([20,40,20]);
    renderRunner();
  }

  function renderBoxingBlock(s, block) {
    const roundNumber = s.roundIndex + 1;
    shell(`
      ${sessionHeader(s,block)}
      <div class="center"><div class="eyebrow">ROUND ${roundNumber} OF ${block.rounds}</div><h1>${block.title.toUpperCase()}</h1></div>
      <div class="timer-ring" style="--timer-progress:18%"><div class="timer-content"><div class="time">02:00</div><div class="muted tiny">READY</div></div></div>
      <div class="card center"><strong>${block.cues[roundNumber % block.cues.length]}</strong></div>
      <button class="btn primary" id="startRound">START ROUND</button><button class="btn danger" id="boxingPain">REPORT PAIN</button><button class="btn ghost" id="skipRound">SKIP ROUND</button>`, { noNav: true });
    document.getElementById('startRound').onclick = () => {
      beginTimer('boxing', block.roundSeconds, () => completeBoxingRound(block));
      renderTimerScreen(`ROUND ${roundNumber}`, block.cues[roundNumber % block.cues.length], block.roundSeconds, true);
    };
    document.getElementById('boxingPain').onclick = () => {
      s.painFlags.push({ blockId:block.id, severity:3, note:'Pain reported during boxing round.', at:Date.now() });
      saveState(); toast('Pain flag saved.');
    };
    document.getElementById('skipRound').onclick = () => {
      s.logs.push({ type:'round', blockId:block.id, round:roundNumber, completedSeconds:0, quality:'skipped', at:Date.now() });
      advanceRound(block);
    };
  }

  function completeBoxingRound(block) {
    const s = state.currentSession;
    if (!s) return;
    s.logs.push({ type:'round', blockId:block.id, round:s.roundIndex+1, completedSeconds:block.roundSeconds, quality:'on-target', at:Date.now() });
    s.activeTimer = null;
    advanceRound(block);
  }

  function advanceRound(block) {
    const s = state.currentSession;
    if (!s) return;
    if (s.roundIndex + 1 < block.rounds) s.roundIndex += 1;
    else { s.roundIndex = 0; s.blockIndex += 1; }
    s.updatedAt = Date.now();
    saveState();
    vibrate([25,45,25]);
    renderRunner();
  }

  function skipCurrentBlock(reason) {
    const s = state.currentSession;
    if (!s) return;
    const block = s.blocks[s.blockIndex];
    s.skipped.push({ blockId:block.id, title:block.title, reason, at:Date.now() });
    s.setIndex = 0; s.roundIndex = 0; s.blockIndex += 1; s.updatedAt = Date.now();
    saveState();
    toast('Block skipped and recorded honestly.');
    renderRunner();
  }

  function beginTimer(kind, seconds, onComplete) {
    const s = state.currentSession;
    if (!s) return;
    s.activeTimer = { kind, durationSeconds:seconds, endsAt:Date.now() + seconds*1000 };
    s.updatedAt = Date.now();
    saveState();
    window.__camposTimerComplete = onComplete;
  }

  function renderTimerScreen(title, subtitle, seconds, boxing = false) {
    const s = state.currentSession;
    if (!s?.activeTimer) return;
    shell(`
      ${topbar(title,'runner')}
      <div class="center"><div class="eyebrow">${boxing ? 'Round active' : 'Timer active'}</div><h2>${escapeHtml(subtitle)}</h2></div>
      <div class="timer-ring" id="activeTimerRing"><div class="timer-content"><div class="time" id="activeTimerText">${formatSeconds(seconds)}</div><div class="muted tiny">${boxing ? 'ROUND TIME' : 'TIME REMAINING'}</div></div></div>
      <button class="btn secondary" id="pauseTimer">PAUSE</button><button class="btn primary" id="finishTimer">FINISH NOW</button><button class="btn ghost" id="addTime">+30 SECONDS</button>`, { noNav: true });

    let pausedRemaining = null;
    const tick = () => {
      const active = state.currentSession?.activeTimer;
      if (!active) return;
      const remaining = pausedRemaining ?? Math.max(0, Math.ceil((active.endsAt - Date.now()) / 1000));
      const pct = Math.max(3, Math.min(100, ((active.durationSeconds - remaining) / active.durationSeconds) * 100));
      document.getElementById('activeTimerText').textContent = formatSeconds(remaining);
      document.getElementById('activeTimerRing').style.setProperty('--timer-progress', `${pct}%`);
      if (remaining <= 0) {
        clearInterval(timerHandle);
        timerHandle = null;
        const callback = window.__camposTimerComplete;
        window.__camposTimerComplete = null;
        if (callback) callback();
      }
    };
    tick();
    timerHandle = setInterval(tick, 250);

    document.getElementById('pauseTimer').onclick = event => {
      const active = state.currentSession?.activeTimer;
      if (!active) return;
      if (pausedRemaining === null) {
        pausedRemaining = Math.max(0, Math.ceil((active.endsAt - Date.now()) / 1000));
        event.currentTarget.textContent = 'RESUME';
      } else {
        active.endsAt = Date.now() + pausedRemaining*1000;
        pausedRemaining = null;
        event.currentTarget.textContent = 'PAUSE';
        saveState();
      }
    };
    document.getElementById('finishTimer').onclick = () => {
      clearInterval(timerHandle); timerHandle = null;
      const callback = window.__camposTimerComplete; window.__camposTimerComplete = null;
      if (callback) callback();
    };
    document.getElementById('addTime').onclick = () => {
      const active = state.currentSession?.activeTimer;
      if (!active) return;
      if (pausedRemaining !== null) pausedRemaining += 30;
      else active.endsAt += 30000;
      active.durationSeconds += 30;
      saveState(); toast('30 seconds added.');
    };
  }

  function finishSession() {
    const s = state.currentSession;
    if (!s) return;
    s.completedAt = Date.now();
    s.activeTimer = null;
    s.updatedAt = Date.now();
    state.sessionHistory.unshift(s);
    state.currentSession = null;
    saveState();
    navigate('complete');
  }

  function renderComplete() {
    const s = state.sessionHistory[0];
    if (!s) { navigate('today'); return; }
    const sets = s.logs.filter(log => log.type === 'set').length;
    const rounds = s.logs.filter(log => log.type === 'round' && log.completedSeconds > 0).length;
    const totalMinutes = Math.max(1, Math.round((s.completedAt - s.startedAt)/60000));
    const quality = s.painFlags.length ? 'PROTECTED' : s.skipped.length ? 'ADJUSTED' : 'ACHIEVED';
    shell(`
      <div class="center"><div class="eyebrow">Session complete</div><h1 style="font-size:42px;margin-top:28px">TODAY’S WORK<br>IS COMPLETE</h1></div>
      <div class="block"><strong style="font-size:25px">${totalMinutes} MIN</strong><span class="muted">TOTAL TIME</span></div>
      <div class="block"><strong style="font-size:25px">${sets}</strong><span class="muted">WORKING SETS</span></div>
      <div class="block"><strong style="font-size:25px">${rounds}</strong><span class="muted">BOXING ROUNDS</span></div>
      <div class="block"><strong style="font-size:25px">${quality}</strong><span class="muted">SESSION TARGET</span></div>
      <div class="card gold" style="margin-top:16px"><div class="eyebrow" style="color:var(--gold)">Performance observation</div><strong>${s.painFlags.length ? 'Safety signal recorded' : s.skipped.length ? 'Continuity protected' : 'Quality protected'}</strong><p class="notice" style="margin:7px 0 0">${s.painFlags.length ? 'CampOS will avoid automatic progression and keep the next recommendation conservative.' : 'Your recorded evidence will shape the next comparable session.'}</p></div>
      <button class="btn primary" data-route="progress">VIEW PROGRESS</button><button class="btn secondary" data-route="today">RETURN TO TODAY</button>`, { noNav: true });
    vibrate([28,55,28]);
  }

  function renderPlan() {
    shell(`
      <div class="topbar"><span></span><strong>WEEK 1 · FOUNDATION</strong><span>＋</span></div>
      <div class="card pressable" data-route="preview"><div class="row"><div><div class="eyebrow">Today</div><h3 style="margin:5px 0">Lower Body + Footwork</h3><span class="muted small">48 min · Adaptive</span></div><span>›</span></div></div>
      <div class="card">
        <div class="block"><span>Monday · Upper Strength</span><span class="badge green">Completed</span></div>
        <div class="block"><span>Tuesday · Recovery Walk</span><span class="badge green">Completed</span></div>
        <div class="block"><span>Wednesday · Lower Strength</span><span class="badge green">Completed</span></div>
        <div class="block"><span>Friday · Full Body</span><span class="muted">65 min</span></div>
        <div class="block"><span>Saturday · Shadowboxing</span><span class="muted">30 min</span></div>
        <div class="block"><span>Sunday · Full Rest</span><span class="muted">—</span></div>
      </div>
      <div class="card gold"><div class="eyebrow" style="color:var(--gold)">Week 2 decision</div><strong>${weekDecision().title}</strong><p class="notice" style="margin:7px 0 0">${weekDecision().reason}</p></div>`, { navActive:'plan' });
  }

  function renderProgress() {
    const history = state.sessionHistory;
    const strengthSets = history.flatMap(s => s.logs || []).filter(l => l.type === 'set');
    const rounds = history.flatMap(s => s.logs || []).filter(l => l.type === 'round' && l.completedSeconds > 0);
    const cleanSets = strengthSets.filter(s => s.effort !== 'pain' && s.reps >= s.targetReps).length;
    const consistency = Math.min(100, Math.round((Math.max(history.length,3)/4)*100));
    const weights = strengthSets.filter(s => s.blockId === 'leg-press').map(s => s.weight).slice(0,7).reverse();
    const bars = (weights.length ? weights : [110,120,125,130,135,140]).map((value,i,arr) => `<div class="chart-bar" style="height:${Math.max(28,(value/Math.max(...arr))*100)}%" data-label="${value}"></div>`).join('');
    shell(`
      <div class="topbar"><span></span><strong>PROGRESS</strong><span>▣</span></div>
      <div class="card"><div class="eyebrow">Current camp</div><h2 style="margin:8px 0 4px">FOUNDATION PHASE</h2><div class="row tiny"><span>WEEK 1 OF 6</span><span>16%</span></div><div class="progress-line" style="margin-top:9px"><span style="width:16%"></span></div></div>
      <div class="metric-grid">
        <div class="metric-card"><div class="muted tiny">SESSIONS</div><strong>${Math.max(history.length,3)}</strong><div class="tiny" style="color:var(--green)">▲ Building consistency</div></div>
        <div class="metric-card"><div class="muted tiny">BOXING ROUNDS</div><strong>${Math.max(rounds.length,9)}</strong><div class="tiny" style="color:var(--green)">▲ Quality tracked</div></div>
        <div class="metric-card"><div class="muted tiny">CLEAN SETS</div><strong>${strengthSets.length ? Math.round((cleanSets/strengthSets.length)*100) : 92}%</strong><div class="tiny muted">Target reps, no pain</div></div>
        <div class="metric-card"><div class="muted tiny">CONSISTENCY</div><strong>${consistency}%</strong><div class="tiny muted">Current training week</div></div>
      </div>
      <div style="height:14px"></div><div class="card"><div class="eyebrow">Leg press history</div><div class="chart">${bars}</div><div style="height:24px"></div><p class="notice">CampOS requires repeated clean performance before recommending a load increase.</p></div>
      <div class="card gold"><div class="eyebrow" style="color:var(--gold)">Coach read</div><strong>${coachRead().title}</strong><p class="notice" style="margin:7px 0 0">${coachRead().body}</p></div>
      <button class="btn ghost" id="exportData">EXPORT MY DEMO DATA</button>`, { navActive:'progress' });
    document.getElementById('exportData').onclick = exportData;
  }

  function renderProfile() {
    shell(`
      <div class="topbar"><span></span><strong>PROFILE</strong><button class="icon-btn" data-route="settings">⚙</button></div>
      <div class="card center"><div class="score" style="margin:0 auto 12px;border-color:var(--red)">${escapeHtml((state.athlete.name || 'MB').split(' ').map(p => p[0]).join('').slice(0,2).toUpperCase())}</div><h2 style="margin-bottom:4px">${escapeHtml(state.athlete.name || 'ATHLETE')}</h2><span class="muted small">Foundation Camp · Week 1</span></div>
      <div class="card">
        <div class="block"><span>Primary goals</span><span class="muted small">${escapeHtml((state.athlete.goals || []).slice(0,2).join(' + '))}</span></div>
        <div class="block"><span>Experience</span><span class="muted small">${escapeHtml(state.athlete.experience)}</span></div>
        <div class="block"><span>Training locations</span><span class="muted small">${escapeHtml((state.athlete.locations || []).join(' + '))}</span></div>
        <div class="block"><span>Coaching style</span><span class="muted small">${escapeHtml(state.athlete.coachStyle)}</span></div>
      </div>
      <button class="btn secondary" data-route="feedback">BETA FEEDBACK</button><button class="btn ghost" data-route="legal">PRIVACY & LEGAL</button>`, { navActive:'profile' });
  }

  function renderFeedback() {
    shell(`
      ${topbar('BETA FEEDBACK','today')}
      <div class="eyebrow">Founder test channel</div><h1>WHAT SHOULD WE FIX?</h1><p class="muted">Reports stay on this device in the founder demo. They can be exported with your other demo data.</p>
      <label class="small muted">REPORT TYPE</label><select id="feedbackType"><option value="bug">Bug</option><option value="friction">Confusing or frustrating</option><option value="feature">Feature idea</option><option value="content">Exercise or coaching content</option><option value="safety">Safety concern</option></select>
      <div style="height:12px"></div><label class="small muted">SEVERITY</label><select id="feedbackSeverity"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option><option value="blocker">Blocking</option></select>
      <div style="height:12px"></div><label class="small muted">DETAILS</label><textarea id="feedbackBody" placeholder="Describe what happened, what you expected, and what would make it better."></textarea>
      <div style="height:12px"></div><button class="btn primary" id="saveFeedback">SAVE REPORT</button>
      <div style="height:18px"></div><div class="eyebrow">Saved reports</div>
      ${state.feedback.length ? state.feedback.map(item => `<div class="card"><div class="row"><span class="badge ${item.type === 'safety' ? 'red' : item.severity === 'high' || item.severity === 'blocker' ? 'gold' : 'green'}">${escapeHtml(item.type.toUpperCase())}</span><span class="tiny muted">${new Date(item.createdAt).toLocaleString()}</span></div><p class="notice" style="margin:10px 0 0">${escapeHtml(item.body)}</p></div>`).join('') : '<div class="empty">No reports saved yet.</div>'}`, { noNav:true });
    document.getElementById('saveFeedback').onclick = () => {
      const body = document.getElementById('feedbackBody').value.trim();
      if (body.length < 8) { toast('Add a little more detail first.'); return; }
      state.feedback.unshift({ id:`feedback-${Date.now()}`, type:document.getElementById('feedbackType').value, severity:document.getElementById('feedbackSeverity').value, body, route:state.route, createdAt:Date.now() });
      saveState(); vibrate([20,35,20]); toast('Founder report saved.'); renderFeedback();
    };
  }

  function renderSettings() {
    shell(`
      ${topbar('SETTINGS','profile')}
      <div class="card">
        ${settingRow('Sound','sound',state.settings.sound)}
        ${settingRow('Haptic feedback','haptics',state.settings.haptics)}
        ${settingRow('Optional product analytics','analytics',state.settings.analytics)}
      </div>
      <div class="card"><div class="eyebrow">Founder demo storage</div><p class="notice">Your onboarding, sessions, readiness, and feedback are stored locally in this browser.</p><button class="btn secondary" id="exportSettings">EXPORT DATA</button><button class="btn danger" id="resetDemo">RESET ALL DEMO DATA</button></div>`, { noNav:true });
    document.querySelectorAll('[data-setting]').forEach(button => {
      button.onclick = () => { const key = button.dataset.setting; state.settings[key] = !state.settings[key]; saveState(); renderSettings(); };
    });
    document.getElementById('exportSettings').onclick = exportData;
    document.getElementById('resetDemo').onclick = () => {
      if (!confirm('Reset all local CampOS demo data?')) return;
      localStorage.removeItem(STORAGE_KEY); state = JSON.parse(JSON.stringify(defaultState)); navigate('welcome');
    };
  }

  function settingRow(label,key,value) {
    return `<div class="block"><div><strong>${label}</strong>${key === 'analytics' ? '<div class="tiny muted">Disabled by default; no ad tracking</div>' : ''}</div><button class="btn inline ${value ? 'primary' : 'ghost'}" data-setting="${key}">${value ? 'ON' : 'OFF'}</button></div>`;
  }

  function renderLegal() {
    shell(`
      ${topbar('PRIVACY & LEGAL','profile')}
      <div class="card"><h3>Founder demo</h3><p class="notice">This browser version stores data locally on your device unless you export it. It is not medical care and does not diagnose injuries.</p></div>
      <a class="btn secondary" href="privacy.html">OPEN PRIVACY NOTICE</a><a class="btn secondary" href="terms.html">OPEN TERMS</a><a class="btn secondary" href="support.html">OPEN SUPPORT</a>`, { noNav:true });
  }

  function bindCommonEvents() {
    document.querySelectorAll('[data-route]').forEach(node => {
      node.addEventListener('click', event => {
        const route = node.dataset.route;
        if (!route) return;
        event.preventDefault();
        navigate(route);
      });
    });
  }

  function formatSeconds(total) {
    const seconds = Math.max(0, Math.floor(total));
    return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
  }

  function suggestedLoad(blockId, fallback) {
    const sets = state.sessionHistory.flatMap(s => s.logs || []).filter(l => l.type === 'set' && l.blockId === blockId);
    if (!sets.length) return { weight:fallback, confidence:'BASELINE', reason:'No dependable history yet. Use a conservative load and leave several clean repetitions available.' };
    const recent = sets.slice(0,6);
    const pain = recent.some(set => set.effort === 'pain');
    const clean = recent.filter(set => set.reps >= set.targetReps && set.effort !== 'pain' && set.effort !== 'harder');
    const latestWeight = recent[0].weight;
    if (pain) return { weight:Math.max(0, latestWeight - 10), confidence:'PROTECTIVE', reason:'Recent pain was recorded. CampOS reduces the suggestion and blocks progression.' };
    if (clean.length >= 4) return { weight:latestWeight + 5, confidence:'MODERATE', reason:'Repeated clean sets at the target support a small five-pound increase.' };
    return { weight:latestWeight, confidence:'MODERATE', reason:'Performance is useful but not yet consistent enough to justify an increase.' };
  }

  function weekDecision() {
    const history = state.sessionHistory;
    const pain = history.some(s => (s.painFlags || []).length);
    const skips = history.reduce((sum,s) => sum + (s.skipped || []).length,0);
    if (pain) return { title:'Maintain and protect', reason:'Pain evidence blocks progression. Next week preserves the main movements and uses safer recommendations.' };
    if (history.length >= 3 && skips === 0) return { title:'Controlled progression available', reason:'Repeated completion without pain supports one small progression variable next week.' };
    return { title:'Maintain the foundation', reason:'CampOS needs more comparable session evidence before increasing workload.' };
  }

  function coachRead() {
    const history = state.sessionHistory;
    const pain = history.some(s => (s.painFlags || []).length);
    if (pain) return { title:'Protect before progressing', body:'A pain signal exists in the session record. The next comparable workout should hold or reduce load until clean execution returns.' };
    if (history.length >= 3) return { title:'Momentum is becoming measurable', body:'You are building enough repeated evidence for CampOS to compare load, completion quality, readiness, and boxing-round consistency.' };
    return { title:'Establishing your baseline', body:'Complete a few comparable sessions. CampOS will avoid pretending one good day proves a trend.' };
  }

  function seedDemoHistory() {
    if (state.demoSeeded) return;
    const now = Date.now();
    const makeSession = (daysAgo,weight,effort='target') => ({
      id:`seed-${daysAgo}`, title:'Lower Body + Footwork', startedAt:now-daysAgo*86400000-3600000, completedAt:now-daysAgo*86400000,
      logs:[
        {type:'set',blockId:'leg-press',title:'Leg Press',set:1,weight,reps:10,targetReps:10,effort,at:now-daysAgo*86400000},
        {type:'set',blockId:'leg-press',title:'Leg Press',set:2,weight,reps:10,targetReps:10,effort,at:now-daysAgo*86400000},
        {type:'round',blockId:'boxing',round:1,completedSeconds:120,quality:'on-target',at:now-daysAgo*86400000}
      ], painFlags:[], skipped:[]
    });
    state.sessionHistory = [makeSession(2,140),makeSession(5,135),makeSession(8,130),...state.sessionHistory];
    state.demoSeeded = true;
    saveState();
  }

  function exportData() {
    const payload = JSON.stringify({ exportedAt:new Date().toISOString(), product:'CampOS Founder Demo', state }, null, 2);
    const blob = new Blob([payload], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = `campos-demo-export-${new Date().toISOString().slice(0,10)}.json`; link.click();
    URL.revokeObjectURL(url);
    toast('Demo data export created.');
  }

  function restoreActiveTimer() {
    const active = state.currentSession?.activeTimer;
    if (!active) return false;
    if (active.endsAt <= Date.now()) {
      state.currentSession.activeTimer = null;
      saveState();
      return false;
    }
    state.route = 'runner';
    return true;
  }

  window.addEventListener('load', () => {
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
    restoreActiveTimer();
    if (!state.onboarded && !['welcome','onboarding'].includes(state.route)) state.route = 'welcome';
    if (state.onboarded && state.route === 'welcome') state.route = 'today';
    render();
  });
})();

  </script>
</body>
</html>
